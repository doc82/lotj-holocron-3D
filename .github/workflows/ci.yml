name: CI

on:
  pull_request:
    branches: [main]
  merge_group:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 24.19.0
  PNPM_VERSION: 11.19.0
  GO_VERSION: 1.25.3

jobs:
  test:
    name: Full test suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: relay/go.mod
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Check JavaScript and TypeScript
        run: pnpm check
      - name: Test renderer and protocol
        run: pnpm test
      - name: Test relay
        run: pnpm relay:test
      - name: Validate Lua 5.1 syntax
        run: |
          sudo apt-get update
          sudo apt-get install --yes lua5.1
          find mudlet -type f -name '*.lua' -print0 | xargs -0 -n1 luac5.1 -p
